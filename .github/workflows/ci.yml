name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install '.[test]' build beautifulsoup4 lxml
      - name: Run tests
        run: python -m pytest tests -q -ra --junitxml=pytest-results.xml
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/citysignal-wheel"
          # The shared environment already contains this version; install local CLI scripts too.
          "$RUNNER_TEMP/citysignal-wheel/bin/python" -m pip install --no-deps --ignore-installed dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/citysignal-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/verify_installed_package.py"
          "$RUNNER_TEMP/citysignal-wheel/bin/python" -I -m citysignal --help
          "$RUNNER_TEMP/citysignal-wheel/bin/citysignal-pipeline" --help
      - name: Save test and build artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: citysignal-python-${{ matrix.python-version }}
          path: |
            pytest-results.xml
            dist/*
